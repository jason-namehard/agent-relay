name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore --locked-mode
      - name: Restore Windows notification helper
        if: runner.os == 'Windows'
        run: dotnet restore src/AgentRelay.Notify/AgentRelay.Notify.csproj --locked-mode
      - run: dotnet test --configuration Release --no-restore
      - name: Windows GUI interaction tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-desktop.ps1 -WorkDirectory "${{ runner.temp }}/agent-relay-desktop-smoke"
      - name: Check direct and transitive package licenses
        shell: pwsh
        run: ./scripts/check-licenses.ps1 -IncludeDesktop:($IsWindows)
      - name: Package CLI with license notices
        shell: pwsh
        run: ./scripts/package.ps1 -Flavor $(if ($IsWindows) { 'Windows' } else { 'Portable' }) -NoRestore
      - name: Upload distributable
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: artifacts/packages/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: release-assets
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; preserving its notes and assets."
            exit 0
          fi
          if [[ "$RELEASE_TAG" == *-preview.* ]]; then
            release_flags=(--prerelease --latest=false)
          else
            release_flags=(--latest)
          fi
          gh release create "$RELEASE_TAG" release-assets/*.zip \
            --verify-tag "${release_flags[@]}" \
            --title "Agent Relay $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md"
